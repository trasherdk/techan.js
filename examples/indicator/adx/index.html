<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ADX</title>
  <link rel="icon" href="/icons/chart.png" type="image/png" sizes="16x16">
  <script src="../theme.js"></script>
  <script src="/lib/d3/v5/d3.js"></script>
  <script src="/lib/techan.min.js"></script>
  <script src="../kraken-data.js"></script>
  <script src="adx-chart.js"></script>
  <link href="../indicator.css?v=1" rel="stylesheet">
</head>

<body>
  <header>
    <h1>Average Directional Index (ADX)</h1>
    <p class="subtitle">Kraken historic OHLC · <code>?symbol=BTC&amp;currency=USD&amp;interval=15m</code></p>
  </header>
  <div id="chart"></div>
  <p id="status" class="status">Loading…</p>

  <script>
    window.addEventListener('DOMContentLoaded', async function () {
      const status = document.getElementById('status')
      try {
        const params = getIndicatorParams()
        const symbol = indicatorDisplaySymbol(params.symbol)
        document.title = `ADX: ${symbol}/${params.currency.toUpperCase()}`
        status.textContent = `Loading ${symbol}/${params.currency.toUpperCase()}…`

        const result = await loadIndicatorOhlc(params)
        const label = `${symbol}/${params.currency.toUpperCase()}`

        d3.select('#chart').call(adxChart(result.data, {
          label: label,
          interval: result.interval
        }))

        status.textContent = `Loaded ${result.data.length} bars from Kraken (${label}, ${formatIndicatorInterval(result.interval)}).`
      } catch (error) {
        console.error(error)
        status.textContent = error.message || 'Failed to load chart data'
        status.classList.add('error')
      }
    })
  </script>
</body>

</html>
